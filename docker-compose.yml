services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vzdc-discord-bot
    restart: unless-stopped
    env_file:
      - .env
    # Lets the container reach osmium (and any other host-published service) via
    # http://host.docker.internal:<port>. Docker Desktop/OrbStack provide this
    # automatically; the mapping keeps it working on plain Linux Docker too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BOT_BIND_PORT:-3010}:3010"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
